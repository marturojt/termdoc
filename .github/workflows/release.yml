name: Release

# Tag-driven: pushing `v0.1.0` builds the binaries and drafts the release.
# The draft is deliberate — the artifacts get looked at before anyone can
# download them, and a release, unlike a tag, is awkward to take back.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Linux x86_64 + aarch64 (native runners, glibc) ───────────────────────────
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `-p termdoc` rather than the whole workspace: the libraries are only here
      # so the binary can depend on them, and nothing ships them.
      - name: Build
        run: cargo build --release -p termdoc

      - name: Package
        run: |
          ARCHIVE="termdoc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/release termdoc
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── macOS universal binary (x86_64 + arm64 via lipo) ─────────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build x86_64
        run: cargo build --release -p termdoc --target x86_64-apple-darwin
      - name: Build aarch64
        run: cargo build --release -p termdoc --target aarch64-apple-darwin

      - name: Create universal binary + package
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/termdoc \
            target/aarch64-apple-darwin/release/termdoc \
            -output termdoc
          ARCHIVE="termdoc-${{ github.ref_name }}-universal-apple-darwin.tar.gz"
          tar -czf "$ARCHIVE" termdoc
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: universal-apple-darwin
          path: ${{ env.ARCHIVE }}

  # ── Windows x86_64 (MSVC) ────────────────────────────────────────────────────
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p termdoc

      - name: Package
        shell: pwsh
        run: |
          $archive = "termdoc-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target\release\termdoc.exe -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: ${{ env.ARCHIVE }}

  # ── Smoke-test the artifacts before they become a release ────────────────────
  # A release that ships a binary nobody ran is a release that ships a broken
  # binary. Only the runner-native targets can be executed here, which is still
  # every platform: the macOS archive is universal and the Linux matrix is native.
  verify:
    name: Verify (${{ matrix.name }})
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: universal-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
      - name: Unpack and run
        run: |
          tar -xzf termdoc-*.tar.gz
          ./termdoc --version
          printf '# hello\n\nsome **text**\n' > sample.md
          ./termdoc sample.md
          # The invariant that matters most: dying on SIGPIPE like cat, not panicking.
          ./termdoc sample.md | head -1
          test "$(./termdoc --formats | tr '\n' ' ')" = "text log markdown "

  # ── Publish GitHub release (draft) ───────────────────────────────────────────
  release:
    name: Publish release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      # The Homebrew formula needs these: it pins each URL to a sha256.
      - name: SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*

[workspace]
resolver = "3"
members = [
    "crates/termdoc-core",
    "crates/termdoc-term",
    "crates/termdoc-layout",
    "crates/termdoc-backend",
    "crates/termdoc-detect",
    "crates/termdoc-read-text",
    "crates/termdoc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marturojt/termdoc"
homepage = "https://termdoc.app"
readme = "README.md"
authors = ["Arturo Jimenez"]
# Shared across the workspace; a crate overrides these when it is about something
# narrower than "viewing documents in a terminal". crates.io caps both at 5.
#
# Not "pager": there is no pager yet — that is M2 — and a keyword is a claim about
# what someone searching will find, not about what is planned.
keywords = ["terminal", "document", "viewer", "cli", "markdown"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
# Internal
termdoc-core = { path = "crates/termdoc-core", version = "0.1.0" }
termdoc-term = { path = "crates/termdoc-term", version = "0.1.0" }
termdoc-layout = { path = "crates/termdoc-layout", version = "0.1.0" }
termdoc-backend = { path = "crates/termdoc-backend", version = "0.1.0" }
termdoc-read-text = { path = "crates/termdoc-read-text", version = "0.1.0" }
termdoc-detect = { path = "crates/termdoc-detect", version = "0.1.0" }

# External — versions verified on crates.io 2026-08-10 (docs/DESIGN.md §9)
clap = { version = "4.6", features = ["derive", "wrap_help"] }
thiserror = "2.0"
pulldown-cmark = { version = "0.13", default-features = false }
memmap2 = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1.13"
terminal_size = "0.4"
encoding_rs = "0.8"
chardetng = "1.0"
infer = { version = "0.22", default-features = false, features = ["std"] }
insta = "1.48"
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = "fat"
codegen-units = 1

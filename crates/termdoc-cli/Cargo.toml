[package]
# The package is `termdoc` so that `cargo install termdoc` works and the flagship name on
# crates.io is the project's own. The directory keeps the `-cli` suffix: it names the
# layer, and tests/layering.rs indexes the graph by directory.
name = "termdoc"
description = "A universal document viewer for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "termdoc"
path = "src/main.rs"

# The CLI is the only crate allowed to see all the others: it is where the pipeline
# gets wired and the readers get registered.
[dependencies]
termdoc-core.workspace = true
termdoc-term.workspace = true
termdoc-layout.workspace = true
termdoc-backend.workspace = true
termdoc-read-text.workspace = true
termdoc-detect.workspace = true
clap.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta.workspace = true

[package]
name = "termdoc-read-text"
description = "Plain-text, Markdown and log readers for termdoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["markdown", "text", "parser", "reader", "logs"]
categories = ["text-processing", "parsing"]

# LAYERING INVARIANT: core only. A reader that could see a backend would end up
# emitting ANSI, which is exactly what the design forbids.
[dependencies]
termdoc-core.workspace = true
pulldown-cmark.workspace = true
